 neighbor 2.2.2.10 remote-as 100
 neighbor 2.2.2.10 description Router r1 of AS100

 neighbor 4.4.4.30 remote-as 300
 neighbor 4.4.4.30 description Router r3 of AS300

 network 3.3.3.0/24